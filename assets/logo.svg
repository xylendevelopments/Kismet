<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Kismet logo">
  <!--
    Kismet mark: an osu!standard hit object.

    A circle with its approach ring, and a slider leaving it toward the playfield
    edge — the two things the engine actually mirrors from webosu!. Deliberately
    geometric so it stays legible at 16px in a browser toolbar and at 512px in a
    repo header.

    Accent #ff6b9d matches the overlay's default accent (src/constants.ts), so the
    mark and the running UI agree.
  -->
  <defs>
    <linearGradient id="ks-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1526"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <linearGradient id="ks-slider" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7fb2ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#d9ecff" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="ks-fill" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffd0e0"/>
      <stop offset="0.45" stop-color="#ff6b9d"/>
      <stop offset="1" stop-color="#c9386e"/>
    </radialGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#ks-bg)"/>
  <rect x="0.75" y="0.75" width="126.5" height="126.5" rx="27.25" fill="none"
        stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Slider path leaving the object. -->
  <path d="M 52 78 C 70 78, 84 66, 96 50" fill="none" stroke="url(#ks-slider)"
        stroke-width="13" stroke-linecap="round"/>
  <path d="M 52 78 C 70 78, 84 66, 96 50" fill="none" stroke="rgba(255,255,255,0.35)"
        stroke-width="2" stroke-linecap="round"/>

  <!-- The hit circle. -->
  <circle cx="52" cy="78" r="17" fill="url(#ks-fill)"/>
  <circle cx="52" cy="78" r="17" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
  <circle cx="52" cy="78" r="7" fill="#ffffff" fill-opacity="0.14"/>

  <!-- Approach ring. -->
  <circle cx="52" cy="78" r="28" fill="none" stroke="#f5f0fb" stroke-opacity="0.35" stroke-width="2.5"/>

  <!-- The slider ball, at the tail. -->
  <circle cx="96" cy="50" r="7.5" fill="#d9ecff"/>
  <circle cx="96" cy="50" r="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5"/>
</svg>
